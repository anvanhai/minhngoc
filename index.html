<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đăng nhập & Đăng ký — Minh Ngọc HSK</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Khung đăng nhập / đăng ký trung tâm -->
  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">学</div>
        <h1 class="auth-title">Minh Ngọc HSK</h1>
        <p class="auth-subtitle">Nền tảng Quản lý Đào tạo & Học Tiếng Trung</p>
      </div>

      <!-- Tab chuyển đổi Đăng nhập / Đăng ký -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tab-btn-login">Đăng nhập</button>
        <button type="button" class="auth-tab-btn" id="tab-btn-register">Đăng ký học viên</button>
      </div>

      <!-- Khung thông báo lỗi / thành công -->
      <div id="auth-alert" class="alert"></div>

      <!-- FORM 1: ĐĂNG NHẬP -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-username">Tên đăng nhập (Username)</label>
          <input
            type="text"
            id="login-username"
            class="form-control"
            placeholder="Ví dụ: minhanh"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Mật khẩu</label>
          <input
            type="password"
            id="login-password"
            class="form-control"
            placeholder="Nhập mật khẩu của bạn"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" id="btn-submit-login" class="btn btn-primary btn-block">
          Đăng nhập vào lớp
        </button>
      </form>

      <!-- FORM 2: ĐĂNG KÝ HỌC VIÊN -->
      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="reg-username">Tên đăng nhập (Viết liền, không dấu)</label>
          <input
            type="text"
            id="reg-username"
            class="form-control"
            placeholder="Ví dụ: hoangnam, thuhuong99"
            autocomplete="username"
            required
          >
          <div class="form-help">Chỉ gồm chữ cái, số và dấu gạch dưới (3–20 ký tự).</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-display-name">Họ và tên của bạn</label>
          <input
            type="text"
            id="reg-display-name"
            class="form-control"
            placeholder="Ví dụ: Nguyễn Minh Anh"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-phone">Số điện thoại (Tùy chọn)</label>
          <input
            type="tel"
            id="reg-phone"
            class="form-control"
            placeholder="Để giáo viên liên hệ khi cần"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Mật khẩu (Tối thiểu 6 ký tự)</label>
          <input
            type="password"
            id="reg-password"
            class="form-control"
            placeholder="Nhập mật khẩu"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password-confirm">Nhập lại mật khẩu</label>
          <input
            type="password"
            id="reg-password-confirm"
            class="form-control"
            placeholder="Xác nhận lại mật khẩu"
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit" id="btn-submit-register" class="btn btn-primary btn-block">
          Tạo tài khoản học sinh
        </button>
      </form>
    </div>
  </div>

  <footer class="footer">
    Minh Ngọc HSK &copy; 2026 · Hệ thống học tiếng Trung thông minh
  </footer>

  <!-- Thư viện Supabase CDN (ghim phiên bản cụ thể) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>

  <!-- Các file logic hệ thống -->
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/xp.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
